<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Catcher Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Game Header / Scoreboard -->
        <div class="scoreboard">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
        </div>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1>🍎 Apple Catcher! 🍎</h1>
            <p>
                Use the <strong>Left/Right Arrow keys</strong> or move your mouse to catch:<br>
                🍎 Red Apples = 10 pts<br>
                🌟 Golden Apples = 50 pts<br>
                ❤️ Hearts = +1 Life<br>
                ⚠️ Green Apples = Lose a life!
            </p>
            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>Game Over</h1>
            <p>Your Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>

        <!-- Playing Area -->
        <div id="game-area">
            <!-- Player / Person -->
            <div id="player">🧑</div>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let lives = 3;
        let gameInterval;
        let appleInterval;
        let isPlaying = false;
        let playerX = 175;
        const gameWidth = 400;
        const playerWidth = 60;
        const gameHeight = 680;

        // Movement controls
        let keys = { ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        // Mouse/Touch movement support
        gameArea.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const rect = gameArea.getBoundingClientRect();
            playerX = e.clientX - rect.left - playerWidth / 2;
            if (playerX < 0) playerX = 0;
            if (playerX > gameWidth - playerWidth) playerX = gameWidth - playerWidth;
            player.style.left = playerX + 'px';
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function startGame() {
            score = 0;
            lives = 3;
            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            document.querySelectorAll('.apple').forEach(apple => apple.remove());

            isPlaying = true;
            playerX = 175;

            gameInterval = setInterval(updateGame, 20);
            appleInterval = setInterval(spawnApple, 750);
        }

        function updateGame() {
            // Handle keyboard movement
            if (keys.ArrowLeft && playerX > 0) {
                playerX -= 8;
            }
            if (keys.ArrowRight && playerX < gameWidth - playerWidth) {
                playerX += 8;
            }
            player.style.left = playerX + 'px';

            // Move items down
            const apples = document.querySelectorAll('.apple');
            apples.forEach(apple => {
                let appleY = parseFloat(apple.dataset.y);
                appleY += 3.2; // Fall speed
                apple.dataset.y = appleY;
                apple.style.top = appleY + 'px';

                // Collision detection with player
                let appleRect = apple.getBoundingClientRect();
                let playerRect = player.getBoundingClientRect();

                if (
                    appleRect.bottom >= playerRect.top &&
                    appleRect.top <= playerRect.bottom &&
                    appleRect.right >= playerRect.left &&
                    appleRect.left <= playerRect.right
                ) {
                    const type = apple.dataset.type;
                    if (type === 'red') {
                        score += 10;
                    } else if (type === 'gold') {
                        score += 50;
                    } else if (type === 'heart') {
                        if (lives < 5) lives++; // Cap max lives at 5
                    } else if (type === 'poison') {
                        lives--;
                    }

                    scoreDisplay.textContent = score;
                    livesDisplay.textContent = lives;
                    apple.remove();

                    if (lives <= 0) {
                        endGame();
                    }
                } 
                // Check if item hit the ground
                else if (appleY > gameHeight) {
                    apple.remove();
                    // Only lose a life if a normal red apple hits the ground
                    if (apple.dataset.type === 'red') {
                        lives--;
                        livesDisplay.textContent = lives;
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                }
            });
        }

        function spawnApple() {
            if (!isPlaying) return;
            const apple = document.createElement('div');
            apple.classList.add('apple');
            
            // Random chance for different item types
            const rand = Math.random();
            let type = 'red';
            let icon = '🍎';

            if (rand < 0.12) {
                type = 'gold';
                icon = '🌟'; // Golden apple
            } else if (rand < 0.22) {
                type = 'heart';
                icon = '❤️'; // Extra life heart
            } else if (rand < 0.35) {
                type = 'poison';
                icon = '🍏'; // Green/bad apple
            }

            apple.textContent = icon;
            apple.dataset.type = type;
            
            let randomX = Math.random() * (gameWidth - 40);
            apple.style.left = randomX + 'px';
            apple.style.top = '0px';
            apple.dataset.y = 0;

            gameArea.appendChild(apple);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(appleInterval);
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
